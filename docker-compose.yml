# Local stack: `docker compose up --build`, then open http://localhost:3000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexmap
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nexmap
      # Replace before exposing this to the internet.
      JWT_SECRET: change-me-to-a-long-random-string
    ports:
      - "3000:3000"

volumes:
  db-data:
